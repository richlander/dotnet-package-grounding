  # ------------------------------------------ system-text-json-dotnet-10-11-strictness (S20-S21)

  - name: "S20: harden a trust boundary against a crafted payload"
    expected_skill: system-text-json-dotnet-10-11-strictness
    prompt: |
      Program.cs holds a payload arriving from an untrusted caller, and a Principal type it is read
      into. The payload states the same property twice with different values — a caller doing this
      deliberately is trying to make our reader disagree with the upstream validator that already
      checked the payload. Read it so that such a payload is rejected outright rather than silently
      resolved to one of the two values, and print `rejected` when that happens. Build and run to
      confirm it prints `rejected` and exits successfully.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s20-untrusted-input/App.csproj }
        - { path: Program.cs, source: fixtures/s20-untrusted-input/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin (AllowDuplicateProperties|JsonSerializerOptions\\.Strict) .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: 'rejected'
        command_timeout: 120
    rubric:
      - "Rejects the duplicate through serializer configuration, not a hand-written pre-scan of the text"
    timeout: 900

