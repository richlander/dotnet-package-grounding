# System.Text.Json — CT-24 workflow ladder
#
# 24 workflow/user-problem scenarios that exercise the base "system-text-json" skill plus the
# five domain skills. The first 6 are the basics (floor); the remaining 18 rise in difficulty
# across system-text-json-converters-and-polymorphism, system-text-json-dom-and-streaming, system-text-json-source-generation-aot,
# system-text-json-dotnet-10-11-strictness, and system-text-json-newtonsoft-migration.
#
# DESIGN: each fixture ships a BARE domain model (plain POCOs/records) + populated data + a TODO
# with NO hint. The agent authors ONLY the serialization. Prompts state the USER'S GOAL — the
# wire contract, the runtime constraint, the observable behaviour — and never name the API,
# attribute, option, or converter under test. A prompt that names the answer is transcribable by
# an ungrounded model and measures nothing.
#
# DUAL GRADING (a hand-roll and the idiom can emit identical bytes):
#   - CODE conformance: the declarative member under test is present (an unguided implementation
#     reaches for a different mechanism or hand-rolls), and for migrations the old dependency is
#     gone from BOTH Program.cs and the .csproj.
#   - OUTPUT conformance: a regex over the REAL program output asserts the exact wire shape —
#     names, casing, presence/absence, restored values — so an over-/under-configured serializer
#     fails while the intended idiom lands.
#
# STATUS: VERIFIED. Every scenario was executed end-to-end against the net10.0 SDK by running a
# reference solution through the real assertions: all 24 build, run, and satisfy their code greps
# and output regexes. Negative controls (a plausible ungrounded solution per scenario shape) were
# also run and correctly FAIL — e.g. S22's naive migration compiles and looks right but drops the
# old library's implicit field and case-insensitive defaults, and only the OUTPUT regex catches it,
# while S16's non-streaming solution emits byte-identical output and only the CODE grep catches it.
# That is the dual-grading rationale, confirmed rather than assumed.
config:
  max_parallel_scenarios: 2
  max_parallel_runs: 2

scenarios:

  # ---------------------------------------------------------------- basics floor (S01-S06)

  - name: "S01: round-trip an object through JSON"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one WeatherReport value. Produce its JSON representation, read that JSON
      back into a new WeatherReport, and print `city=<City> temp=<TemperatureF>` using the values
      from the restored object (so the round trip is proven, not assumed). Do not hand-build the
      JSON text. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s01-roundtrip/App.csproj }
        - { path: Program.cs, source: fixtures/s01-roundtrip/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonSerializer .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "\\\"City\\\":" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: 'city=Seattle\s+temp=72'
        command_timeout: 120
    rubric:
      - "Serializes and deserializes through JsonSerializer rather than hand-building JSON text"
      - "Prints values read from the deserialized instance, proving the round trip"
    timeout: 900

  - name: "S02: emit JSON a human will read in a terminal"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one Report value. Print its JSON so a person reading the terminal can scan
      it easily — each property on its own line, nested structure visibly indented, rather than
      one dense line. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s02-indented/App.csproj }
        - { path: Program.cs, source: fixtures/s02-indented/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin WriteIndented .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '\{\s*\n\s+"Name": "Build",\s*\n\s+"Passed": true\s*\n\}'
        command_timeout: 120
    rubric:
      - "Turns on indented writing through serializer options rather than post-processing the string"
    timeout: 900

  - name: "S03: match a wire contract that requires camelCase names"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one UserProfile value. The service it is sent to requires every JSON
      property name to begin with a lower-case letter (`displayName`, not `DisplayName`). Print the
      JSON in the shape that service accepts. The model will grow over time, so the rule must apply
      to every property automatically: a property added to the record later must come out correctly
      named without anyone having to touch that property individually. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s03-wire-names-camel/App.csproj }
        - { path: Program.cs, source: fixtures/s03-wire-names-camel/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin PropertyNamingPolicy .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "JsonPropertyName" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"displayName": ?"Ada")(?=[\s\S]*"loginCount": ?5)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Applies a naming policy across the whole type instead of annotating each property"
    timeout: 900

  - name: "S04: leave absent values out of the payload entirely"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one Person whose Nickname is not set. The receiving system treats a property
      that is present-but-empty differently from a property that is absent, and we want absent.
      Print the JSON so that any property with no value is simply not written, while the properties
      that do have values are unchanged. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s04-omit-nulls/App.csproj }
        - { path: Program.cs, source: fixtures/s04-omit-nulls/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin WhenWritingNull .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"Name": ?"Ada")(?=[\s\S]*"City": ?"London")(?![\s\S]*Nickname)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Configures null omission through serializer options rather than a bespoke DTO or manual filtering"
    timeout: 900

  - name: "S05: two properties whose wire names differ from the C# names"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one PackageInfo value and the exact JSON text the partner service exchanges.
      That service spells the two fields `package_id` and `download_count`; our C# names must stay
      as they are. Print the JSON we would send (it must match the partner's spelling), then read
      the partner's incoming text back into a PackageInfo and print
      `id=<PackageId> downloads=<DownloadCount>`. Only these two properties are affected — do not
      impose a blanket renaming rule on the type. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s05-wire-names-snake/App.csproj }
        - { path: Program.cs, source: fixtures/s05-wire-names-snake/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonPropertyName .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"package_id": ?"Serilog")(?=[\s\S]*id=Serilog\s+downloads=1234)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Renames exactly the two affected properties; does not apply a type-wide naming policy"
    timeout: 900

  - name: "S06: a type that keeps its data in public fields"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds a TelemetrySample type that stores its data in public fields rather than
      properties, plus the JSON text we receive. Read that text into a TelemetrySample and print
      `name=<Name> count=<Count>`, then print the JSON we would send back — it must carry both
      values, not an empty object. Do not restructure the type; other code depends on its shape.
      Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s06-fields/App.csproj }
        - { path: Program.cs, source: fixtures/s06-fields/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin (IncludeFields|JsonInclude) .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "public string Name { get" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*name=requests\s+count=3)(?=[\s\S]*"Count": ?3)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Opts fields into serialization instead of converting the fields to properties"
    timeout: 900

  # ------------------------------------------------- base-skill traps, rising (S07-S10)

  - name: "S07: consume a payload whose names differ only in first-letter case"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds the exact JSON our upstream service sends and a WorkItem class whose
      property names differ from it only in the case of the first letter. Read that payload into a
      WorkItem and print `title=<Title> priority=<Priority>`. The upstream team will not change
      their spelling and we will not rename our properties. Build and run to confirm the values are
      actually populated rather than left at their defaults.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s07-incoming-camel/App.csproj }
        - { path: Program.cs, source: fixtures/s07-incoming-camel/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin (PropertyNameCaseInsensitive|JsonSerializerDefaults\\.Web) .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: 'title=Refactor\s+priority=5'
        command_timeout: 120
    rubric:
      - "Relaxes name matching through options rather than renaming properties or adding per-property attributes"
      - "Prints populated values, not empty string / zero"
    timeout: 900

  - name: "S08: load a hand-maintained config file"
    expected_skill: system-text-json
    prompt: |
      config.jsonc ships beside the program. It is edited by hand, so it carries explanatory notes
      between the data and a stray comma after the final entry — and it will keep doing so. Read
      that file as it is into an AppConfig and print `name=<Name> enabled=<Enabled>`. Do not modify,
      pre-clean, or rewrite the file. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj,    source: fixtures/s08-config-file/App.csproj }
        - { path: Program.cs,    source: fixtures/s08-config-file/Program.cs }
        - { path: config.jsonc,  source: fixtures/s08-config-file/config.jsonc }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin AllowTrailingCommas .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin ReadCommentHandling .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_contains, path: "config.jsonc", value: "// the deployment writes this file" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: 'name=demo\s+enabled=True'
        command_timeout: 120
    rubric:
      - "Tolerates the comment and the trailing comma via reader options; leaves config.jsonc untouched"
    timeout: 900

  - name: "S09: an enum that must travel as a readable word"
    expected_skill: system-text-json
    prompt: |
      Program.cs holds one Job value and the JSON our partner sends. The partner's payloads spell
      the status as a word (`Complete`), not a number, and they expect ours to do the same — a
      numeric status is rejected at their end. Print the JSON we would send, then read their
      incoming text back and print `status=<Status>`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s09-enum-wire/App.csproj }
        - { path: Program.cs, source: fixtures/s09-enum-wire/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonStringEnumConverter .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"Status": ?"Complete")(?=[\s\S]*status=Complete)(?![\s\S]*"Status": ?2)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Registers the string-enum conversion rather than projecting to a string property by hand"
    timeout: 900

  - name: "S10: an object graph that points back at itself"
    expected_skill: system-text-json
    prompt: |
      Program.cs builds a Node whose Next points back to the node itself — this happens in our real
      data and today serializing it fails outright. Print the JSON for that graph without crashing
      and without running forever, writing each distinct object once. The Node type is used
      elsewhere and must not change shape. Build and run to confirm it completes and prints the
      root node's name.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s10-self-reference/App.csproj }
        - { path: Program.cs, source: fixtures/s10-self-reference/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin ReferenceHandler .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '"[Nn]ame": ?"root"'
        command_timeout: 120
    rubric:
      - "Handles the cycle through reference handling; does not null out Next or add a bespoke DTO"
    timeout: 900

  # ------------------------------------- system-text-json-converters-and-polymorphism (S11-S13)

  - name: "S11: a value type with its own on-the-wire spelling"
    expected_skill: system-text-json-converters-and-polymorphism
    prompt: |
      Program.cs holds one Temperature value and the exact text the instrument API uses for it:
      the string `"72F"` — degrees followed by an F, not an object and not a bare number. Print the
      JSON we would send for that Temperature (it must be that same string form), then read the
      instrument's text back into a Temperature and print `degrees=<Degrees>`. Temperature is a
      shared type and must keep its current shape. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s11-scalar-format/App.csproj }
        - { path: Program.cs, source: fixtures/s11-scalar-format/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonConverter .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"72F")(?=[\s\S]*degrees=72)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Supplies a converter for the type instead of hand-formatting at each call site"
    timeout: 900

  - name: "S12: a mixed collection that must come back as the right kinds"
    expected_skill: system-text-json-converters-and-polymorphism
    prompt: |
      Program.cs holds an array typed as the Animal base type but holding a Dog and a Cat. Print the
      JSON for that array — it must carry each element's kind-specific data (the dog's GoodBoy, the
      cat's Lives), not just the shared Name. Then read that JSON back into an Animal array and
      print one line per element in the form `<index>=<runtime type name>`, so element 0 reports Dog
      and element 1 reports Cat. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s12-derived-types/App.csproj }
        - { path: Program.cs, source: fixtures/s12-derived-types/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonDerivedType .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*0=Dog)(?=[\s\S]*1=Cat)(?=[\s\S]*GoodBoy)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Declares the derived types with a discriminator; does not switch on type by hand or serialize as object"
    timeout: 900

  - name: "S13: forward properties we do not model"
    expected_skill: system-text-json-converters-and-polymorphism
    prompt: |
      Program.cs holds the JSON an upstream service sends and a Product type that models only some
      of it. Upstream adds new properties without telling us, and we act as a relay: whatever we
      receive must still be present when we write the object back out. Read the payload into a
      Product and print the JSON we would forward — it must still carry the properties Product does
      not declare, alongside the one it does. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s13-unknown-properties/App.csproj }
        - { path: Program.cs, source: fixtures/s13-unknown-properties/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonExtensionData .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"Colour")(?=[\s\S]*"Weight")(?=[\s\S]*"Name")[\s\S]*'
        command_timeout: 120
    rubric:
      - "Captures undeclared properties on the model rather than adding properties for them or relaying raw text"
    timeout: 900

  # ------------------------------------------------- system-text-json-dom-and-streaming (S14-S16)

  - name: "S14: edit a payload whose shape we do not control"
    expected_skill: system-text-json-dom-and-streaming
    prompt: |
      Program.cs holds a JSON payload that arrives from a system whose schema changes without
      notice, so we deliberately do NOT model it as a C# type. Make two edits to it and print the
      result: drop any property whose value is empty, and add a property `verified` set to true.
      Everything else must survive unchanged. Do not declare a class or record for the payload and
      do not edit it as text. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s14-edit-document/App.csproj }
        - { path: Program.cs, source: fixtures/s14-edit-document/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonNode .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "Replace(" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*"verified": ?true)(?=[\s\S]*"userName": ?"ada")(?![\s\S]*"temp")[\s\S]*'
        command_timeout: 120
    rubric:
      - "Mutates the document through the DOM; no model type, no string surgery"
    timeout: 900

  - name: "S15: answer two questions about a payload without modelling it"
    expected_skill: system-text-json-dom-and-streaming
    prompt: |
      Program.cs holds a JSON payload. We only ever read from it — nothing is modified and nothing
      is written back — so it is not worth defining C# types for its shape. Print `count=<N>` where
      N is the number of entries in its items array, and `tag=<T>` where T is the tag of the entry
      whose id is 2. Do not declare a class or record for the payload. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s15-inspect-document/App.csproj }
        - { path: Program.cs, source: fixtures/s15-inspect-document/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin (JsonDocument|JsonElement) .", expected_exit_code: 0, command_timeout: 30 }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: '(?=[\s\S]*count=3)(?=[\s\S]*tag=b)[\s\S]*'
        command_timeout: 120
    rubric:
      - "Reads through the read-only document API and disposes it; does not materialise the whole payload as models"
    timeout: 900

  - name: "S16: process a feed that will not fit in memory"
