    expected_skill: system-text-json-source-generation-aot
    prompt: |
      This project is published ahead of time (see the .csproj) — the shipped binary contains no
      metadata for types that are only reached dynamically, and publishing warns about any code
      that depends on such metadata. Program.cs holds one BuildRecord and the JSON we receive.
      Print the JSON we would send, then read the incoming text back and print
      `name=<Name> attempts=<Attempts>`. This must work in the published binary and must not
      introduce a publish-time trim or AOT warning. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/s17-aot-publish/App.csproj }
        - { path: Program.cs, source: fixtures/s17-aot-publish/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonSerializerContext .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin JsonSerializable .", expected_exit_code: 0, command_timeout: 30 }
