config:
  max_parallel_scenarios: 1

# =============================================================================
# System.CommandLine — CT-24. A grounding packet for the CURRENT GA / 3.x API
# (System.CommandLine 3.0.0-preview.7, net10.0). The 2.0 GA release was a
# breaking redesign that REMOVED the beta invocation/binding stack (SetHandler,
# AddOption/AddCommand/AddGlobalOption, BinderBase<T>, IConsole, HelpBuilder,
# getDefaultValue:, IsRequired, ExistingOnly). Training data and the open web are
# dominated by that removed beta API, so an ungrounded agent tends to write code
# that DOES NOT COMPILE against GA/3.x. HYPOTHESIS: grounding's value here is high
# even for basic tasks (C01-C12) because the frontier's default reflexes are the
# removed beta stack; the tail (C13-C24) adds real migrations, custom
# parsers/validators/help, and the 3.x additions (CaptureRemainingTokens, the
# AcceptOnlyFromAmong(StringComparer,...) overload, RootCommand.HelpName). Web is
# blocked so the eval reads model + skill knowledge, not archaeology. Every API
# shape, error message, and exit code below was verified by building and running
# against System.CommandLine 3.0.0-preview.5.26302.115 on net10.0. The fixtures
# have since been repinned to 3.0.0-preview.7.26381.103 — the latest published 3.x, and the
# version the skills now tell readers to install — so the eval exercises the
# guidance we actually give.
#
# STATUS: VERIFIED on preview.6. Every scenario was re-executed end-to-end by
# running a reference solution through the real assertions: all 24 build, run,
# and satisfy their code greps and output regexes on
# 3.0.0-preview.7.26381.103/net10.0. Negative controls were also run and
# correctly FAIL (e.g. C09 with the option repeated per-subcommand instead of
# declared Recursive, and C11 hand-rolling repeated-option parsing off raw args).
#
# NOTE: C19-C21 grade members that do NOT exist in stable 2.0.11
# (Argument<T>.CaptureRemainingTokens, RootCommand.HelpName, and the
# AcceptOnlyFromAmong(StringComparer, ...) overload — all three fail to compile
# against 2.0.11). This suite therefore cannot be repointed at the stable package
# without dropping or reworking those three scenarios.
#
# PROMPTS state the USER'S GOAL — what someone typing the command should
# experience, and the operational requirement behind it — and never name the API,
# member, or mechanism under test. An earlier revision leaked the mechanism in
# both the prompt and the fixture TODO ("Use a VALIDATOR", "with a CUSTOM
# PARSER", "Swap the built-in help option's action", "captures ALL remaining
# tokens"), which an ungrounded model can act on by transcription. Fixtures now
# carry a bare "see the task description" TODO plus any seed code; only the
# migration fixtures contain API names, because the old API is the thing being
# migrated. The agent receives ONLY the prompt field — scenario names and rubrics
# are grader-only.
#
# DUAL GRADING: a build failure already catches the removed beta stack, but a
# hand-rolled args[] loop both COMPILES and can print the expected line. So each
# scenario also asserts CODE conformance — the specific GA/3.x member its rubric
# names must appear, and manual argv indexing must not — alongside the OUTPUT
# regex. expected_skill records the methodology prior: the ONE skill the scenario
# targets, which is what the skill-attribution analysis joins against.
# =============================================================================

scenarios:
  - name: "C01: parse an option and run an action"
    expected_skill: system-commandline   # methodology prior: the base skill owns declare -> add -> read-by-identity
    prompt: |
      This console project builds a command-line tool. A user runs it as
      `tool --name Ada` and should see `Hello, Ada!`. Build that command-line surface:
      accept the supplied name, print the greeting, and return an exit code. Build and
      run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c01-greeter/App.csproj }
        - { path: Program.cs, source: fixtures/c01-greeter/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --name Ada"
        expected_exit_code: 0
        expected_std_output_matches: 'Hello, Ada!'
        command_timeout: 120
    rubric:
      - "Uses SetAction (not the removed SetHandler) and reads the value via parseResult.GetValue(option)"
      - "Runs via Parse(args).Invoke()/InvokeAsync() — not the removed Invoke(args) overload"
    timeout: 900

  - name: "C02: option with a default value"
    expected_skill: system-commandline   # methodology prior: default values are base-skill surface
    prompt: |
      The tool takes a `--count` setting. It is optional: when the user omits it
      entirely the tool must behave exactly as though they had passed 3. Print
      `count=<count>`. Running with no arguments at all must print `count=3`. Build and
      run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c02-default/App.csproj }
        - { path: Program.cs, source: fixtures/c02-default/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin DefaultValueFactory .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'count=3'
        command_timeout: 120
    rubric:
      - "Sets the default with DefaultValueFactory = _ => 3 (not the removed getDefaultValue: ctor arg or SetDefaultValue)"
    timeout: 900

  - name: "C03: a required option"
    expected_skill: system-commandline   # methodology prior: required is base-skill surface
    prompt: |
      The tool takes a `--city` setting, and it is mandatory. A user who forgets it
      must get an error and a non-zero exit code — not a silent default and not an
      unhandled crash. When it is supplied, print `city=<city>`. Build and run to
      confirm both paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c03-required/App.csproj }
        - { path: Program.cs, source: fixtures/c03-required/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin Required\s*=\s*true .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --city Rome"
        expected_exit_code: 0
        expected_std_output_matches: 'city=Rome'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 1
        expected_std_error_matches: 'is required'
        command_timeout: 120
    rubric:
      - "Marks the option Required = true (not the removed IsRequired)"
      - "Missing required input yields a non-zero exit code via the parser, not a thrown exception"
    timeout: 900

  - name: "C04: option alias and description"
    expected_skill: system-commandline   # methodology prior: aliases/description are base-skill surface
    prompt: |
      Users of this tool want a short form for the `--output` setting: both
      `--output dist` and `-o dist` must be accepted and print `out=dist`. When a user
      asks for help, the flag must be explained as `Destination directory`. Build and
      run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c04-alias-desc/App.csproj }
        - { path: Program.cs, source: fixtures/c04-alias-desc/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - { type: file_not_contains, path: "Program.cs", value: "\"--output\", \"Destination directory\"" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- -o dist"
        expected_exit_code: 0
        expected_std_output_matches: 'out=dist'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --help"
        expected_exit_code: 0
        expected_std_output_contains: "Destination directory"
        command_timeout: 120
    rubric:
      - "Puts the description in { Description = ... } — NOT as the 2nd positional ctor arg (which is an alias)"
      - "Registers -o as a real alias so it resolves to the same option"
    timeout: 900

  - name: "C05: a positional argument"
    expected_skill: system-commandline   # methodology prior: positional arguments are base-skill surface
    prompt: |
      The tool takes a path as a bare operand — the user types `tool ./somewhere`
      with no flag name in front of it. Print `path=<path>`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c05-argument/App.csproj }
        - { path: Program.cs, source: fixtures/c05-argument/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Arguments.Add .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- foo.txt"
        expected_exit_code: 0
        expected_std_output_matches: 'path=foo\.txt'
        command_timeout: 120
    rubric:
      - "Uses Argument<T> added via Arguments.Add and read by identity with parseResult.GetValue"
    timeout: 900

  - name: "C06: typed integer options"
    expected_skill: system-commandline   # methodology prior: typed options are base-skill surface
    prompt: |
      The tool takes two whole numbers, `--left` and `--right`, and prints
      `sum=<left plus right>`. The values must reach the code as numbers rather than as
      text the code converts itself. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c06-int-option/App.csproj }
        - { path: Program.cs, source: fixtures/c06-int-option/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin Option<int> .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --left 2 --right 3"
        expected_exit_code: 0
        expected_std_output_matches: 'sum=5'
        command_timeout: 120
    rubric:
      - "Uses Option<int> and reads the typed values by identity"
    timeout: 900

  - name: "C07: a subcommand"
    expected_skill: system-commandline-subcommands-and-help   # methodology prior: subcommand composition
    prompt: |
      This tool will grow to several distinct operations, so greeting is its own
      verb rather than a bare flag on the tool. A user runs `tool greet --name Zoe` and
      sees `Hello Zoe`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c07-subcommand/App.csproj }
        - { path: Program.cs, source: fixtures/c07-subcommand/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Subcommands.Add .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- greet --name Zoe"
        expected_exit_code: 0
        expected_std_output_matches: 'Hello Zoe'
        command_timeout: 120
    rubric:
      - "Adds the subcommand via Subcommands.Add (not the removed AddCommand)"
      - "The subcommand carries its own SetAction"
    timeout: 900

  - name: "C08: two subcommands with distinct actions"
    expected_skill: system-commandline-subcommands-and-help   # methodology prior: subcommand composition
    prompt: |
      The tool exposes two operations the user selects by name: `add <item>` prints
      `added <item>`, and `list` prints `listing`. Running `tool add 5` must print
      `added 5`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c08-two-subcommands/App.csproj }
        - { path: Program.cs, source: fixtures/c08-two-subcommands/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Subcommands.Add .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- add 5"
        expected_exit_code: 0
        expected_std_output_matches: 'added 5'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- list"
        expected_exit_code: 0
        expected_std_output_matches: 'listing'
        command_timeout: 120
    rubric:
      - "Each subcommand added via Subcommands.Add with its own action and argument"
    timeout: 900

  - name: "C09: a global (recursive) option"
    expected_skill: system-commandline-subcommands-and-help   # methodology prior: recursive option across a command tree
    prompt: |
      `--verbose` applies to the tool as a whole rather than to one operation: a
      user may supply it alongside any operation and it means the same thing everywhere.
      Running `tool run --verbose` must print `verbose=True`. Declare it once at the top
      level — do not repeat it on each operation. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c09-recursive-option/App.csproj }
        - { path: Program.cs, source: fixtures/c09-recursive-option/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin Recursive\s*=\s*true .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- run --verbose"
        expected_exit_code: 0
        expected_std_output_matches: 'verbose=True'
        command_timeout: 120
    rubric:
      - "Sets option.Recursive = true then adds it once (replaces the removed AddGlobalOption)"
      - "The descendant reads it from its own ParseResult by identity"
    timeout: 900

  - name: "C10: constrained option values"
    expected_skill: system-commandline-options-and-arguments   # methodology prior: value constraints live with options/arguments
    prompt: |
      The tool takes a `--level` setting that accepts only `debug`, `info`, or
      `warn`. A valid value prints `level=<level>`. Anything else must be refused before
      the tool does any of its own work, exiting with a non-zero code and telling the
      user what was wrong — the user must not see an unhandled exception. Build and run
      to confirm both paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c10-constrained/App.csproj }
        - { path: Program.cs, source: fixtures/c10-constrained/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --level info"
        expected_exit_code: 0
        expected_std_output_matches: 'level=info'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --level bogus"
        expected_exit_code: 1
        expected_std_error_matches: 'not recognized'
        command_timeout: 120
    rubric:
      - "Uses AcceptOnlyFromAmong(\"debug\", \"info\", \"warn\")"
      - "Invalid input fails at parse time with a non-zero exit code, not a thrown exception"
    timeout: 900

  - name: "C11: an option supplied multiple times"
    expected_skill: system-commandline-options-and-arguments   # methodology prior: arity / repeated values
    prompt: |
      A user may label a run more than once, supplying the same `--tag` setting
      several times in one command line: `tool --tag a --tag b`. Every value must be
      kept, printing `tags=a,b`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c11-multiple-values/App.csproj }
        - { path: Program.cs, source: fixtures/c11-multiple-values/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin Option<(string\[\]|List<string>)> .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --tag a --tag b"
        expected_exit_code: 0
        expected_std_output_matches: 'tags=a,b'
        command_timeout: 120
    rubric:
      - "Uses Option<string[]> (or List<string>) to collect repeated values"
    timeout: 900

  - name: "C12: an asynchronous action"
    expected_skill: system-commandline-actions-and-invocation   # methodology prior: async action + async invocation
    prompt: |
      The tool takes a `--url` setting naming something it fetches. That fetch is
      I/O-bound, so the tool must await the work rather than blocking while it waits,
      all the way out to the process exit. Print `fetched <url>` once it completes.
      Running with `--url x` must print `fetched x`. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c12-async/App.csproj }
        - { path: Program.cs, source: fixtures/c12-async/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin InvokeAsync .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --url x"
        expected_exit_code: 0
        expected_std_output_matches: 'fetched x'
        command_timeout: 120
    rubric:
      - "Uses SetAction(async (parseResult, cancellationToken) => ...) and Parse(args).InvokeAsync()"
    timeout: 900

  - name: "C13: migrate a beta greeter to GA/3.x"
    expected_skill: system-commandline-beta-to-ga-migration   # methodology prior: removed beta API -> GA
    prompt: |
      Program.cs was written against an older release of System.CommandLine and no
      longer compiles against the version this project references. Get it building and
      running again with its behaviour unchanged: running `--name Ada` must print
      `Hello, Ada!`, and the option keeps its current name, default, description, and
      the fact that it is mandatory. Build and run to confirm.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c13-migrate-greeter/App.csproj }
        - { path: Program.cs, source: fixtures/c13-migrate-greeter/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - { type: file_not_contains, path: "Program.cs", value: "SetHandler" }
      - { type: file_not_contains, path: "Program.cs", value: "AddOption" }
      - { type: file_not_contains, path: "Program.cs", value: "AddGlobalOption" }
      - { type: file_not_contains, path: "Program.cs", value: "getDefaultValue:" }
      - { type: file_not_contains, path: "Program.cs", value: "IsRequired" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --name Ada"
        expected_exit_code: 0
        expected_std_output_matches: 'Hello, Ada!'
        command_timeout: 120
    rubric:
      - "AddOption -> Options.Add; SetHandler -> SetAction; InvokeAsync(args) -> Parse(args).InvokeAsync()"
      - "getDefaultValue: -> DefaultValueFactory; IsRequired -> Required; description ctor arg -> { Description = ... }"
    timeout: 900

  - name: "C14: a file argument that must exist"
    expected_skill: system-commandline-options-and-arguments   # methodology prior: argument validation on FileInfo
    prompt: |
      The tool takes a path as a bare operand and reports on that file, printing
      `read <name>` using the file's name. A path that does not exist must be refused
      with a non-zero exit code before the tool reaches its own logic, so that code
      never has to cope with a missing file. A file named `data.txt` ships beside the
      program. Build and run to confirm both paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/c14-file-arg/App.csproj }
        - { path: Program.cs, source: fixtures/c14-file-arg/Program.cs }
        - { path: data.txt, source: fixtures/c14-file-arg/data.txt }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin AcceptExistingOnly .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[0]" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- data.txt"
        expected_exit_code: 0
        expected_std_output_matches: 'read data\.txt'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
