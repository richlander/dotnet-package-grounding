# External-validity unit for the delivery-channel comparison (Markout task).
# Registers the REAL upstream NuGet.Mcp.Server (run via `dnx NuGet.Mcp.Server`).
# Its get_package_context returns the INSTALLED package's shipped agent doc if present,
# else the README. We toggle the package cache (agent doc present/absent) to measure both:
#   * doc absent  -> baseline=raw README on disk (Ch A); plugin=NuGet MCP -> README (Ch B)
#   * doc present -> baseline=raw README, doc ignored (Ch A'); plugin=NuGet MCP -> doc (Ch C)
# Single-tool, task-type gated. Not a content unit (ships no grounding).
name: markout-realmcp
package: Markout
description: >-
  Inert shell unit that attaches the real NuGet MCP server to the Markout M1 report
  task. Measures the upstream server's actual delivery (README vs shipped agent doc) and the
  agent's call behavior, against a raw package-on-disk baseline. Not a content unit.
