config:
  max_parallel_scenarios: 1

# Screening corpus derived from two independent production adopters:
# richlander/dotnet-inspect and microsoft/kiota. These are deliberately compound
# task shapes rather than one-public-member-per-task API coverage. Keep this
# probe small until reference solutions, negative controls, and a baseline run
# establish which tasks discriminate.

scenarios:
  - name: "A01: dedicated asynchronous command action"
    expected_skill: system-commandline-adopter-probe
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another command-line
      parser. The project contains an asynchronous Processor service. Build a command-line
      tool around it that accepts a required `--input` value and prints `handled=<value>`.

      Keep command construction and execution separate: Program.cs should build and
      wire the command, while a dedicated action class owns execution, receives the
      existing Processor and the input definition, and passes cancellation through to
      the service. Do not move the processing logic into an inline delegate. Build and
      run with `--input demo` to confirm the result.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/a01-action-class/Program.cs }
        - { path: Processor.cs, source: fixtures/a01-action-class/Processor.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin .Action .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin override.*InvokeAsync .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --input demo"
        expected_exit_code: 0
        expected_std_output_matches: 'handled=demo'
        command_timeout: 120
    rubric:
      - "Uses a dedicated AsynchronousCommandLineAction assigned through Command.Action, rather than an inline SetAction delegate"
      - "Carries the exact Option<string> instance into the action and reads it from ParseResult by identity"
      - "Passes the InvokeAsync cancellation token through to Processor.HandleAsync"
    timeout: 900

  - name: "A02: several values after one option token"
    expected_skill: system-commandline-adopter-probe
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another command-line
      parser. Build a tool with a `--path` setting that accepts several paths after a
      single occurrence, so `tool --path src tests docs` prints
      `paths=src,tests,docs`. Repeating the setting must also work:
      `tool --path src --path tests` prints `paths=src,tests`.

      Use the command-line parser's typed collection support; do not parse raw `args`
      yourself. Build and run both forms to confirm them.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/a02-multi-value/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin Option< .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin AllowMultipleArgumentsPerToken .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --path src tests docs"
        expected_exit_code: 0
        expected_std_output_matches: 'paths=src,tests,docs'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --path src --path tests"
        expected_exit_code: 0
        expected_std_output_matches: 'paths=src,tests'
        command_timeout: 120
    rubric:
      - "Uses a collection-typed option whose arity supports both required forms"
      - "Opts into multiple arguments per token so the one-token-many-values form is accepted"
      - "Reads the collection from ParseResult by option identity instead of parsing argv"
    timeout: 900

  - name: "A03: complete user-facing option contract"
    expected_skill: system-commandline-adopter-probe
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another command-line
      parser. Build a tool with an optional `--format` setting and short form `-f`.
      Omitting it prints `format=json`; passing `-f yaml` prints `format=yaml`.

      Only `json` and `yaml` are valid, case-insensitively. Other values must be
      rejected before the tool's action runs, with an error that names the valid
      values. Help must render the option as `--format <json|yaml>`, and shell
      completion must offer both values. Use the parser-generated help; do not replace
      its help action or print help yourself. Build and run the default, alias, help,
      and invalid-value paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/a03-option-contract/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin CompletionSources.Add|AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin Validators.Add|CustomParser|AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "HelpOption" }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'format=json'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- -f yaml"
        expected_exit_code: 0
        expected_std_output_matches: 'format=yaml'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --format YAML"
        expected_exit_code: 0
        expected_std_output_matches: 'format=yaml'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --help"
        expected_exit_code: 0
        expected_std_output_matches: '--format <json\|yaml>'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --format xml"
        expected_exit_code: 1
        expected_std_error_matches: '(?is)json.*yaml'
        command_timeout: 120
    rubric:
      - "Implements the default, alias, help placeholder, completion candidates, and validation as one coherent option contract"
      - "Validation is case-insensitive and runs before the command action"
      - "Does not hand-parse args or print its own help"
    timeout: 900

  - name: "A04: all-or-none authentication settings"
    expected_skill: system-commandline-adopter-probe
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another command-line
      parser. Build a tool with optional `--auth-type` and `--auth-id` settings.
      Authentication is enabled only when the user explicitly supplies both. Supplying
      neither prints `auth=anonymous`; supplying
      `--auth-type pat --auth-id abc` prints `auth=pat:abc`.

      Supplying either setting alone must be rejected before the action runs, with a
      non-zero exit and an error saying both settings or neither are required.
      `--auth-type` has a parser default of `device`, but that default must not make an
      explicitly supplied `--auth-id` count as a complete pair. Build and run all four
      paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/a04-all-or-none/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin DefaultValueFactory .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Validators.Add .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin GetResult .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Tokens .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'auth=anonymous'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --auth-type pat --auth-id abc"
        expected_exit_code: 0
        expected_std_output_matches: 'auth=pat:abc'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --auth-type pat"
        expected_exit_code: 1
        expected_std_error_matches: '(?i)both.*(neither|omitted)'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --auth-id abc"
        expected_exit_code: 1
        expected_std_error_matches: '(?i)both.*(neither|omitted)'
        command_timeout: 120
    rubric:
      - "Attaches an all-or-none validator to the command, not to either individual option or the action"
      - "Uses explicit token presence from CommandResult.GetResult rather than parsed values, so the default does not masquerade as user input"
      - "The invalid pair is rejected before action invocation"
    timeout: 900

  - name: "A05: compile-clean alias and description regression"
    expected_skill: system-commandline-adopter-probe
    prompt: |
      Modify this provided .NET project's Program.cs. It references System.CommandLine
      2.0.10; do not create another project or use another command-line parser. The tool
      still builds after its dependency update, but its output setting regressed. Restore
      the intended contract: `--output dist` and `-o dist` both print `out=dist`, and
      `--help` explains the setting as `destination`.

      Do not replace the command-line library or hand-write help text. Build and run
      the long form, short form, and help to confirm the fix.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/a05-silent-ctor/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: file_not_contains, path: "Program.cs", value: '"--output", "-o", "destination"' }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Description .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --output dist"
        expected_exit_code: 0
        expected_std_output_matches: 'out=dist'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- -o dist"
        expected_exit_code: 0
        expected_std_output_matches: 'out=dist'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --help"
        expected_exit_code: 0
        expected_std_output_matches: '--output <output>\s+destination'
        command_timeout: 120
    rubric:
      - "Moves the description into the Description property and registers -o as an alias"
      - "Preserves parser-generated help and reads the option by identity"
      - "Fixes the compile-clean behavior regression rather than only making the project build"
    timeout: 900
