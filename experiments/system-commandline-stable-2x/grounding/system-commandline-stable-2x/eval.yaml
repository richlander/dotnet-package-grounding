      `plugin add` requires a `--type` setting that accepts one or more
      values in a single invocation; only `openai`, `azure`, and `ollama` are
      valid, case-insensitively, with completion offering all three, and an
      unknown value rejected before the action runs. `plugin edit`'s `--type`
      is optional, with the same known-values validation and completion when
      a value is supplied. Both subcommands also accept optional
      `--auth-type` (defaulting to `device`) and `--auth-id` settings, where
      authentication is enabled only when the user explicitly supplies both;
      supplying either alone is rejected before the action runs (attach this
      rule per-subcommand, based on explicit token presence, not the parsed
      default). `plugin add --type openai --auth-type pat --auth-id abc`
      prints `add;type=openai;auth=pat:abc`; `plugin add --type OpenAI`
      (no auth) prints `add;type=openai;auth=anonymous`; `plugin edit
      --type ollama` prints `edit;type=ollama;auth=anonymous`; `plugin edit`
      with no type prints `edit;type=unchanged;auth=anonymous`.

      Build and run: a valid `add` with full auth, an `add` with an
      uppercase type and no auth, an invalid auth pair on `add`, a missing
      `--type` on `add`, a valid `edit` with only a type, and an invalid auth
      pair on `edit`.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s18-plugin-add-edit/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin CompletionSources.Add|AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin Validators.Add .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin add --type openai --auth-type pat --auth-id abc"
        expected_exit_code: 0
        expected_std_output_matches: 'add;type=openai;auth=pat:abc'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin add --type OpenAI"
        expected_exit_code: 0
        expected_std_output_matches: 'add;type=openai;auth=anonymous'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin add --type openai --auth-type pat"
        expected_exit_code: 1
        expected_std_error_matches: '(?i)both.*(neither|omitted)'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin add"
        expected_exit_code: 1
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin edit --type ollama"
        expected_exit_code: 0
        expected_std_output_matches: 'edit;type=ollama;auth=anonymous'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin edit"
        expected_exit_code: 0
        expected_std_output_matches: 'edit;type=unchanged;auth=anonymous'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- plugin edit --auth-id abc"
        expected_exit_code: 1
        expected_std_error_matches: '(?i)both.*(neither|omitted)'
        command_timeout: 120
    rubric:
      - "add and edit each have a dedicated asynchronous action, not an inline SetAction delegate"
      - "add's --type is required and case-insensitively validated/completed; edit's --type is optional with the same contract"
      - "Each subcommand enforces its own auth all-or-none rule from explicit token presence, and the add/edit route is identifiable from output"
    timeout: 900
