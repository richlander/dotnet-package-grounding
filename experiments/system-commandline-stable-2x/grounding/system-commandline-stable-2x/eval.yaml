config:
  max_parallel_scenarios: 1

# =============================================================================
# System.CommandLine — clean-slate stable 2.0.10 adopter-derived suite
# (net10.0). This unit intentionally deviates from the CT-24 default
# methodology: instead of one task per public-API-surface concept ordered by
# doc-TOC depth, every scenario here is sourced from real usage in two
# independent production adopters and screened for survival before being kept.
# Adopters and pinned commits:
#   - richlander/dotnet-inspect@233c7a5f0a1b910eb63754fb0a281d65a915be37
#   - microsoft/kiota@44926c3b3b3e6cae3e3081f88596682bd5efdcf5
#
# Screening note (from the prior system-commandline-adopter-probe run):
# A01/A03/A04 survived the screen as real discriminators and are folded into
# this ladder (S01, S08, S15). A02 (collection option arity/token-per-value)
# and A05 (constructor-vs-Description regression) are MODEL-RESIDENT — both
# arms already got them right, so they buy nothing as standalone graded tasks.
# They still appear here only as INCIDENTAL CARRIER IDIOMS inside compound
# scenarios (e.g. AllowMultipleArgumentsPerToken inside S09/S12's collection
# options, Description/alias placement inside S07/S10), never as a scenario's
# own graded discriminator.
#
# Every prompt below states user-visible behavior and architecture in prose —
# never a member, type, or method name — and instructs the agent to modify the
# PROVIDED project's Program.cs, which already references System.CommandLine
# 2.0.10, to create no other project or parser, and to build + run every path
# named in the prompt. web_search / web_fetch are blocked per scenario so the
# eval reads model + skill knowledge, not archaeology. No scenario requires a
# 3.x-preview-only member (CaptureRemainingTokens, RootCommand.HelpName, or the
# AcceptOnlyFromAmong(StringComparer, ...) overload) — all were confirmed
# unavailable / unnecessary against 2.0.10 while drafting these tasks. Every
# reference solution below was built and run end-to-end against
# System.CommandLine 2.0.10 / net10.0 before this file was written; see
# check-scl-stable-suite.py in the session workspace for the harness that
# reproduces that verification against both the references and the negative
# controls.
# =============================================================================

scenarios:
  - name: "S01: dedicated asynchronous command action"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. The project contains an asynchronous Processor
      service. Build a command-line tool around it that accepts a required
      `--input` value and prints `handled=<value>`.

      Keep command construction and execution separate: Program.cs should
      build and wire the command, while a dedicated action class owns
      execution, receives the existing Processor and the input definition, and
      passes cancellation through to the service. Do not move the processing
      logic into an inline delegate. Build and run with `--input demo` to
      confirm the result.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s01-action-class/Program.cs }
        - { path: Processor.cs, source: fixtures/s01-action-class/Processor.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin .Action .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin override.*InvokeAsync .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --input demo"
        expected_exit_code: 0
        expected_std_output_matches: 'handled=demo'
        command_timeout: 120
    rubric:
      - "Uses a dedicated AsynchronousCommandLineAction assigned through Command.Action, rather than an inline SetAction delegate"
      - "Carries the exact Option<string> instance into the action and reads it from ParseResult by identity"
      - "Passes the InvokeAsync cancellation token through to Processor.HandleAsync"
    timeout: 900

  - name: "S02: RPC-style direct command action"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build an RPC-style tool with a `--mode` setting
      (values `Stdio` or `NamedPipe`, defaulting to `Stdio`) and a `--pipe-name`
      setting defaulting to `rpc`. Running the tool prints
      `mode=<mode>;pipe=<pipe-name>` using whichever values were supplied or
      defaulted.

      Keep command construction and execution separate: Program.cs should
      build and wire the command, while a dedicated asynchronous action class
      owns execution and reads both settings from the parse result by
      identity. Do not use an inline delegate for the action. Build and run
      both the all-omitted path and an explicit
      `--mode NamedPipe --pipe-name custom` path to confirm both.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s02-rpc-action/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'mode=Stdio;pipe=rpc'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --mode NamedPipe --pipe-name custom"
        expected_exit_code: 0
        expected_std_output_matches: 'mode=NamedPipe;pipe=custom'
        command_timeout: 120
    rubric:
      - "Uses a dedicated AsynchronousCommandLineAction rather than an inline SetAction delegate"
      - "Reads both --mode and --pipe-name from ParseResult by identity, respecting the enum default and the string default"
      - "Both the omitted and fully-explicit invocation paths produce the exact reported line"
    timeout: 900

  - name: "S03: shared abstract asynchronous action base"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. The project has a LoggingService with a Describe
      method. Build a job runner with a `--log-level` setting (default `info`)
      and a required `--job` setting. Running it prints the logging
      service's description of the log level followed by `;job=<job>`, e.g.
      `log=info;job=build` when `--job build` is given with no log level, or
      `log=debug;job=deploy` for `--log-level debug --job deploy`.

      Put the log-level option and the LoggingService dependency on a common
      abstract asynchronous action base class; a leaf action derived from that
      base owns the `--job` option and the actual execution. Program.cs
      builds and wires the command and assigns the leaf action as the
      command's action. Do not use an inline delegate. Build and run both the
      default-log-level and explicit-log-level paths to confirm the output
      proves both the shared base's contribution and the leaf's.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s03-shared-base/Program.cs }
        - { path: LoggingService.cs, source: fixtures/s03-shared-base/LoggingService.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin abstract[[:space:]]+class .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --job build"
        expected_exit_code: 0
        expected_std_output_matches: 'log=info;job=build'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --log-level debug --job deploy"
        expected_exit_code: 0
        expected_std_output_matches: 'log=debug;job=deploy'
        command_timeout: 120
    rubric:
      - "Declares an abstract asynchronous command action base carrying --log-level and the LoggingService dependency"
      - "A leaf action derived from that base owns --job and is assigned as the command's action"
      - "Both the default and explicit log-level paths prove the base's contribution alongside the leaf's own option"
    timeout: 900

  - name: "S04: action carries a positional argument and an option by identity"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build an `export` subcommand that takes a required
      `<source>` value directly after the command name and an optional
      `--format` setting defaulting to `json`, so `export data.csv --format
      json` prints `source=data.csv;format=json`.

      The project contains an ExportService. A dedicated asynchronous action
      class for the export command must read both the exact positional
      argument instance and the exact option instance from the parse result,
      then pass their values and the invocation's cancellation token to that
      service. Do not use an inline delegate. Build and run the command to
      confirm the output.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s04-export-action/Program.cs }
        - { path: ExportService.cs, source: fixtures/s04-export-action/ExportService.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin Argument< .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin ExportAsync .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin cancellationToken .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- export data.csv --format json"
        expected_exit_code: 0
        expected_std_output_matches: 'source=data.csv;format=json'
        command_timeout: 120
    rubric:
      - "Uses a dedicated AsynchronousCommandLineAction for the export command, not an inline SetAction delegate"
      - "Reads both the exact Argument<string> and Option<string> instances from ParseResult by identity"
      - "Passes InvokeAsync's cancellation token through to ExportService.ExportAsync rather than discarding it"
    timeout: 900

  - name: "S05: nested three-level leaf action"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build a three-level command tree: `login` contains
      a `github` subcommand, which contains a `pat` subcommand with a required
      `--token` value. Running `login github pat --token abc` prints
      `login=github;auth=pat;token=abc`. The two routing parent commands
      (`login` and `github`) do no work of their own — they only route to
      their child.

      Only the leaf `pat` command has a dedicated asynchronous action class
      that reads `--token` and prints the result; do not use an inline
      delegate for it. Build and run the full command, and confirm that
      omitting `--token` is rejected before any output is produced.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s05-nested-login/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- login github pat --token abc"
        expected_exit_code: 0
        expected_std_output_matches: 'login=github;auth=pat;token=abc'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- login github pat"
        expected_exit_code: 1
        command_timeout: 120
    rubric:
      - "Builds a three-level command tree where login and github route without their own actions"
      - "Only the pat leaf has a dedicated AsynchronousCommandLineAction, not an inline SetAction"
      - "Missing --token is rejected by the parser before any action runs"
    timeout: 900

  - name: "S06: sibling add/edit commands with separate option instances"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build a `client` command with two subcommands:
      `add`, which requires a `--language` value and prints
      `add;language=<value>`, and `edit`, whose `--language` value is
      optional — if omitted, print `edit;language=unchanged`, otherwise print
      `edit;language=<value>`.

      Give `add` and `edit` their own separate `--language` option instance
      and their own dedicated asynchronous action class for each; do not use
      inline action delegates or attach the same option instance to both
      commands. Build and run `client add --language
      csharp`, `client edit` (with no language), and `client edit --language
      python` to confirm all three, plus confirm that omitting `--language`
      on `add` is rejected.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s06-client-add-edit/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin :[[:space:]]*AsynchronousCommandLineAction .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin SetAction .', expected_exit_code: 1, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqF --include=*.cs --exclude-dir=obj --exclude-dir=bin Option<string?> .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- client add --language csharp"
        expected_exit_code: 0
        expected_std_output_matches: 'add;language=csharp'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- client edit"
        expected_exit_code: 0
        expected_std_output_matches: 'edit;language=unchanged'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- client edit --language python"
        expected_exit_code: 0
        expected_std_output_matches: 'edit;language=python'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- client add"
        expected_exit_code: 1
        command_timeout: 120
    rubric:
      - "add's --language is required and edit's --language is an independent, optional, nullable instance"
      - "The same Option instance is never attached to both add and edit"
      - "Each subcommand has its own asynchronous action class producing the exact reported line"
    timeout: 900

  - name: "S07: output option help placeholder and default"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build a generator tool with an `--output` setting
      and short form `-o`, defaulting to `./generated`. Both `--output dist`
      and `-o dist` should print `output=dist`, and omitting it should print
      `output=./generated`.

      Use the parser's own generated help; do not print help yourself. Help
      must render the option's placeholder as `<path>`. Build and run the
      default, long-form, short-form, and help paths to confirm all four.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s07-output-option/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: file_not_contains, path: "Program.cs", value: "HelpOption" }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'output=\./generated'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --output dist"
        expected_exit_code: 0
        expected_std_output_matches: 'output=dist'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- -o dist"
        expected_exit_code: 0
        expected_std_output_matches: 'output=dist'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --help"
        expected_exit_code: 0
        expected_std_output_matches: '--output <path>'
        command_timeout: 120
    rubric:
      - "The option renders its parser-generated help placeholder as <path>, not the property or option name"
      - "Both -o and --output resolve to the same option identity with the same default"
      - "Help is entirely parser-generated, not hand-written"
    timeout: 900

  - name: "S08: case-insensitive known-value option contract"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
      command-line parser. Build a tool with an optional `--format` setting
      and short form `-f`. Omitting it prints `format=json`; passing `-f
      yaml` prints `format=yaml`.

      Only `json` and `yaml` are valid, case-insensitively. Other values must
      be rejected before the tool's action runs, with an error that names the
      valid values. Help must render the option as `--format <json|yaml>`,
      and shell completion must offer both values. Use the parser-generated
      help; do not replace its help action or print help yourself. Build and
      run the default, alias, help, and invalid-value paths.
    setup:
      files:
        - { path: App.csproj, source: fixtures/shared/App.csproj }
        - { path: Program.cs, source: fixtures/s08-format-contract/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin CompletionSources.Add|AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: '-rqE --include=*.cs --exclude-dir=obj --exclude-dir=bin Validators.Add|CustomParser|AcceptOnlyFromAmong .', expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "HelpOption" }
      - { type: file_not_contains, path: "Program.cs", value: "args[" }
      - { type: file_not_contains, path: "Program.cs", value: "args." }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build --"
        expected_exit_code: 0
        expected_std_output_matches: 'format=json'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- -f yaml"
        expected_exit_code: 0
        expected_std_output_matches: 'format=yaml'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --format YAML"
        expected_exit_code: 0
        expected_std_output_matches: 'format=yaml'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --help"
        expected_exit_code: 0
        expected_std_output_matches: '--format <json\|yaml>'
        command_timeout: 120
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build -- --format xml"
        expected_exit_code: 1
        expected_std_error_matches: '(?is)json.*yaml'
        command_timeout: 120
    rubric:
      - "Implements the default, alias, help placeholder, completion candidates, and validation as one coherent option contract"
      - "Validation is case-insensitive and runs before the command action"
      - "Does not hand-parse args or print its own help"
    timeout: 900

  - name: "S09: required typed list with completion and validation"
    expected_skill: system-commandline-stable-2x
    prompt: |
      Modify this provided .NET project's Program.cs. It already references
      System.CommandLine 2.0.10; do not create another project or use another
