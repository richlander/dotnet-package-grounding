name: markout-0.35.2-ct24
description: Complete CT-24 full-shelf evaluation translated deterministically from the pinned Markout regime.
version: 0.35.2
type: capability
tags:
  markout-package-version: 0.35.2
  markout-package-sha256: b407f0188a27d59934b17c5855f4716afa6385975cb214bc3767ff69dbedff38
  ct24-source-eval-sha256: sha256:1ec9b86eed7789ef024ed74c5b882b94a82564a6ae3416221dfefc6961e8ec42
  ct24-fixture-hash: sha256:a2ad9d70d44b9546cf28082a2692c007f7aa6702d09edecb6ef796ddb83581de
  shelf-hash: sha256:f4bcaaac648f3d5ee231409957abcd07954169e66576c80e8ca878fc5b7c5675
  applicability-hash: sha256:d23391ca6e0644bc5b5dd9866a7c6462bd5a136200acee3ecaed7832a62f52a0
  markout-source-commit: e744d7ba3b13c6490bd3a660a4cc87f235f81918
  vally-source-commit: f7a653272642d52b2b6375bfa3995dddc72fcd49
defaults:
  runs: 5
  timeout: 20m
  executor: copilot-sdk
  model: claude-haiku-4.5
  judge_model: gpt-5.5
  judge_reasoning_effort: high
scoring:
  threshold: 1
stimuli:
  - name: "CT01: minimal report — title + scalar field table"
    prompt: |
      This console project references a source-generated .NET serializer that projects annotated objects into Markdown (see the package reference in the .csproj). Program.cs holds
      one plain BuildReport object. Using the serializer, print a Markdown report whose H1 title is the
      project name, followed by a Field | Value table of the remaining scalar values (Configuration,
      Warnings, Errors). Drive the output through the serializer — do not hand-write the
      Markdown. Build and run the project to confirm it prints the expected report.
    tags:
      task-id: CT01
      expected-skill: markout
      source-index: "0"
    environment:
      files:
        - src: global.json
          dest: global.json
        - src: vendor/fixtures/ct01/Report.csproj
          dest: Report.csproj
        - src: vendor/fixtures/ct01/Program.cs
          dest: Program.cs
    constraints:
      max_duration: 15m
      reject_tools:
        - web_search
        - web_fetch
    graders:
      - type: completed
        name: harness/completed
      - type: run-command
        name: satisfies/01-build-the-project
        config:
          command: dotnet
          args:
            - build
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        name: delivers/02-drive-output-through-markoutserializer-serialize
        config:
          command: grep
          args:
            - -rq
            - --include=*.cs
            - --exclude-dir=obj
            - --exclude-dir=bin
            - MarkoutSerializer.Serialize
            - .
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: delivers/03-register-the-model-with-a-markout-serializer-context
        config:
          command: grep
          args:
            - -rq
            - --include=*.cs
            - --exclude-dir=obj
            - --exclude-dir=bin
            - MarkoutContext
            - .
          expected_exit_code: 0
          timeout: 30s
      - type: file-not-contains
        name: delivers/04-do-not-hand-write-the-markdown-table
        config:
          path: Program.cs
          value: "| ---"
      - type: run-command
        name: satisfies/05-render-the-project-title-and-scalar-field-value-rows
        config:
          command: dotnet
          args:
            - run
            - --no-build
          expected_exit_code: 0
          timeout: 2m
          stdout_matches: (?=[\s\S]*# Web\.Api)(?=[\s\S]*\| Configuration \| Release \|)(?=[\s\S]*\| Warnings \| 3 \|)[\s\S]*
  - name: "CT02: scalar cell formatters (number, date, bool)"
    prompt: |
      This console project references a source-generated Markdown serializer (see the .csproj).
      Program.cs holds one plain PackageInfo object. Using the serializer, print a Markdown report with an H1
      title from the package Id and a Field | Value table where:
        - Downloads is shown thousands-separated AND suffixed with the word "downloads", as one cell
          (e.g. 5,100,000,000 downloads) — the label text must be produced by the formatter, not by
          concatenating a string yourself
        - Published is shown as an ISO date (yyyy-MM-dd)
        - Signed is shown as "Yes"/"No"
      Presentation must live on the model via the serializer's formatting attributes — do NOT pre-format the
      values with inline ToString/string.Format or a ternary. Drive output through the serializer; do
      not hand-write Markdown. Build and run to confirm.
    tags:
      task-id: CT02
      expected-skill: markout
      source-index: "1"
    environment:
      files:
        - src: global.json
          dest: global.json
        - src: vendor/fixtures/ct02/Report.csproj
