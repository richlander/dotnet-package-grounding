name: evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned skill-validator commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < eng/skill-validator.sha)" >> "$GITHUB_OUTPUT"

      # Build the validator from the pinned commit, mirroring how dotnet/skills
      # builds it in-repo (dotnet publish SkillValidator.csproj). The pin lives on
      # a fork branch carrying the holistic eval mode this study's protocol needs;
      # see docs/harness.md "How it relates to dotnet/skills".
      - name: Checkout skill-validator @ pinned SHA
        uses: actions/checkout@v4
        with:
          repository: richlander/skills
          ref: ${{ steps.pin.outputs.sha }}
          path: .tools/skills-src

      - name: Verify the pin implements holistic eval mode
        run: |
          # Upstream accepts --eval-mode and ignores it, so a pin without the option
          # produces legacy pairwise numbers and no warning that anything changed.
          if ! grep -q -- '--eval-mode' \
            .tools/skills-src/eng/skill-validator/src/Evaluate/EvaluateCommand.cs; then
            echo "::error::Pinned commit has no --eval-mode; rebase holistic-harness."
            exit 1
          fi

      - name: Setup .NET (matches skill-validator global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: .tools/skills-src/global.json

      - name: Build skill-validator
        run: |
          dotnet publish .tools/skills-src/eng/skill-validator/src/SkillValidator.csproj \
            -c Release -o .tools/skill-validator

      # The GitHub Copilot SDK that skill-validator uses picks up gh credentials.
      - name: Verify gh authentication
        if: env.COPILOT_GITHUB_TOKEN != ''
        run: gh auth token >/dev/null
        env:
          GH_TOKEN: ${{ env.COPILOT_GITHUB_TOKEN }}

      - name: Skip live evals without Copilot token
        if: env.COPILOT_GITHUB_TOKEN == ''
        run: |
          echo "COPILOT_GITHUB_TOKEN is not configured; skipping live package-grounding evals."

      - name: Run package-grounding evals
        if: env.COPILOT_GITHUB_TOKEN != ''
        run: .tools/skill-validator/skill-validator evaluate --tests-dir ./tests ./grounding
        env:
          GH_TOKEN: ${{ env.COPILOT_GITHUB_TOKEN }}

      - name: Upload results
        if: always() && env.COPILOT_GITHUB_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: skill-validator-results
          path: .skill-validator-results/
